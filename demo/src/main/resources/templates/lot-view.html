<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Boeing Lot Visualizer</title>
    <style>
        .grid { display: table; border-spacing: 2px; }
        .row { display: table-row; }
        .block {
            display: table-cell;
            width: 40px; height: 40px;
            border: 1px solid #ccc;
            text-align: center;
            vertical-align: middle;
            font-size: 10px;
            color: white;
        }
        .available { background-color: #2ecc71; } /* Green */
        .occupied { background-color: #e74c3c; }  /* Red */
    </style>
</head>
<body>
    <h1>Parking Lot Map</h1>
    <div th:if="${errorMessage}" style="color: red;">
        <p th:text="${errorMessage}"></p>
    </div>
    <div class="grid">
        <div class="row" th:each="row : ${lot.blocks}">
            <div th:each="block : ${row}" 
                 th:classappend="${block.space == null} ? 'available' : 'occupied'" 
                 class="block">
                <span th:text="${block.xCoord} + ',' + ${block.yCoord}">0,0</span>
            </div>
        </div>
    </div>
    <div id="form">
        <h2>Add Parking Space Form</h2>
        <p>Use the X and Y coordinates of the first block starting from the top left of the space.</p>
        <form th:action="@{/lot-view}" method="post">
            <label>X-Coordinate</label>
            <input type="number" min="0" max="9" name="x_coord" />

            <label>Y-Coordinate</label>
            <input type="number" min="0" max="9" name="y_coord" />

            <label>Length</label>
            <input type="number" min="0" max="9" name="length" />

            <label>Width</label>
            <input type="number" min="0" max="9" name="width" />

            <button type="submit">Create</button>
        </form>
    </div>
</body>
</html>
