<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Boeing Lot Visualizer</title>
    <style>
        /* Container to hold the grid and the sidebar */
        .main-container {
            display: flex;
            align-items: flex-start; /* Keeps the sidebar at the top */
            gap: 30px;               /* Space between grid and details */
            margin-bottom: 30px;
        }

        /* Ensure the details div has a fixed width so it doesn't jump around */
        #spaceDetails {
            min-width: 250px;
            border: 1px solid #333;
            padding: 15px;
            background: #fdfdfd;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .grid { display: table; border-spacing: 2px; }
        .row { display: table-row; }
        .block {
            display: table-cell;
            width: 40px; height: 40px;
            border: 1px solid #ccc;
            text-align: center;
            vertical-align: middle;
            font-size: 10px;
            color: white;
        }
        .available { background-color: #2ecc71; } /* Green */
        .occupied { background-color: #e74c3c; }  /* Red */
        .empty { background-color: #808080; }
    </style>
</head>
<body>
    <h1>Parking Lot Map</h1>
    <div th:if="${errorMessage}" style="color: red;">
        <p th:text="${errorMessage}"></p>
    </div>
    <div th:if="${result}">
        <p th:text="${result}"></p>
    </div>
    <div id="sidebar-content">
        <h3 id="details-title">Space Details</h3>
        <p id="details-text">Select a block to see details.</p>

        <div id="park-form-container" style="display: none;">
            <hr>
            <h4>Park a Vehicle</h4>
            <form th:action="@{/park}" method="post">
                <input type="hidden" name="spaceId" id="input-spaceId">

                <label>License Plate:</label>
                <input type="text" name="plate" required class="form-control">

                <label>Make:</label>
                <input type="text" name="make" class="form-control">

                <label>Model:</label>
                <input type="text" name="model" class="form-control">

                <label>Size:</label>
                <select name="size" class="form-control">
                    <option value="COMPACT">Compact</option>
                    <option value="MID_SIZE">Mid-Size</option>
                    <option value="SUV">SUV</option>
                    <option value="TRUCK">Truck</option>
                </select>

                <button type="submit" class="btn btn-primary mt-2">Commit Parking</button>
            </form>
        </div>
    </div>
    <div class="main-container">
        <div class="grid">
            <div class="row" th:each="row : ${lot.blocks}">
                <div th:each="block : ${row}" 
                    th:classappend="${block.space == null} ? 'empty' : (${block.space.vehicle == null} ? 'available' : 'occupied')" 
                    class="block"
                    th:data-space-id="${block.space != null ? block.space.spaceId : ''}"
                    th:data-space-size="${block.space != null ? block.space.size : ''}"
                    th:data-occupied="${block.space != null && block.space.vehicle != null}"
                    th:data-plate="${block.space?.vehicle?.plate}" 
                    th:data-vehicle-size="${block.space?.vehicle?.size}"
                    th:onclick="handleBlockClick(this)">
                    <span th:text="${block.xCoord} + ',' + ${block.yCoord}">0,0</span>
                </div>
            </div>
        </div>
        <div id="spaceDetails" style="display:none; border: 1px solid black; padding: 10px; margin-top: 20px; background: #f9f9f9;">
            <h3>Space Details</h3>
            <p>ID: <span id="displaySpaceId"></span></p>
        
            <form th:action="@{/delete-space}" method="post">
                <input type="hidden" name="spaceId" id="hiddenSpaceIdInput" />
                <button type="submit" style="background-color: #e74c3c; color: white;">Delete Space</button>
            </form>
        </div>
    </div>
    <div id="form">
        <h2>Add Parking Space Form</h2>
        <p>Use the X and Y coordinates of the first block starting from the top left of the space.</p>
        <form th:action="@{/lot-view}" method="post">
            <label>X-Coordinate</label>
            <input type="number" min="0" max="9" name="x_coord" />

            <label>Y-Coordinate</label>
            <input type="number" min="0" max="9" name="y_coord" />

            <label>Length</label>
            <input type="number" min="0" max="9" name="length" />

            <label>Width</label>
            <input type="number" min="0" max="9" name="width" />

            <button type="submit">Create</button>
        </form>
    </div>
    <script>
        function handleBlockClick(block) {
            const spaceId = block.getAttribute('data-space-id');
            const plate = block.getAttribute('data-plate');
            const vehicleSize = block.getAttribute('data-vehicle-size');
            const spaceSize = block.getAttribute('data-space-size');
            const occupied = block.getAttribute('data-occupied');
            const formContainer = document.getElementById('park-form-container');
            const spaceIdInput = document.getElementById('input-spaceId');
            const detailsText = document.getElementById('details-text');
            
            if (spaceId) {
                spaceIdInput.value = spaceId; // Set the ID for the form
                if (occupied == "true") {
                    formContainer.style.display = 'none';
                    detailsText.innerHTML = `Space: ${spaceId} <br> Occupied by: ${plate}`;
                } else {
                    formContainer.style.display = 'block';
                    detailsText.innerHTML = `Space: ${spaceId} <br> Size: ${spaceSize}`;
                }
            } else {
                formContainer.style.display = 'none';
                detailsText.innerText = "This is empty pavement. Add a space first.";
            }
        }   
    </script>
</body>
</html>
